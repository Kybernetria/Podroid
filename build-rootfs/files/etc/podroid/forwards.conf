# Podroid vsock-agent initial forward table.
# Format:
#   <vport>  tcp  <host>  <gport>
#   <vport>  ctl
#
# SSH and user-defined forwards are supplied by Android at runtime. The minimal
# guest does not seed display or audio endpoints.

# Control channel (matches VsockControlChannel.CTL_PORT on Android).
9100  ctl
